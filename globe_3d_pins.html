<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bee Wonderer</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "VT323", monospace;
      font-weight: 400;
      font-style: normal;
    }

    #info {
      position: fixed;
      left: 16px;
      top: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0);
      border: 0px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 30px;
      line-height: 1.35;
      user-select: none;
      backdrop-filter: blur(6px);
    }

    #info strong {
      display: block;
      margin-bottom: 4px;
    }

    canvas {
      display: block;
    }

    #bottomButtons{
  position:fixed;
  bottom:70px;
  left:85%;
  transform:translateX(-50%);
  display:flex;
  gap:30px;
  z-index:500;
}

#bottomButtons img{
  width:150px;
  height:150px;
  cursor:pointer;
  object-fit:contain;
  transition:.2s;
}

#bottomButtons img:hover{
  transform:scale(1.08);
}

#pinPopup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:400px;
  background:rgb(255, 255, 255);
  color:black;
  border-radius:12px;
  padding:20px;
  display:none;
  z-index:5000;
}

#modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(255, 255, 255, 0);
  z-index:9000;
}

#modalContent{
  width:85%;
  height:85%;
  background:white;
  border-radius:12px;
  overflow:hidden;
  position:relative;
}

#modalFrame{
  width:100%;
  height:100%;
  border:none;
}

#closeModal{
  position:absolute;
  top:10px;
  right:10px;
  width:40px;
  height:40px;
  z-index:9999;
  cursor:pointer;
}
  </style>
</head>
<body>
  <div id="info">
    <strong>apiconIASIS</strong>
    Help us save the bees!
  </div>

  <div id="bottomButtons">

  <img
    id="infoButton"
    src="assets/info-button.png"
    alt="Info">

  <img
    id="weatherButton"
    src="assets/weather-button.png"
    alt="Weather">

</div>

<div id="pinPopup">

  <h2 id="pinTitle"></h2>

  <p id="pinDescription"></p>

  <button id="playLevelButton">
    Play
  </button>

  <button id="closePinPopup">
    Close
  </button>

</div>

<div id="modal">

  <div id="modalContent">

    <button id="closeModal">
      ✕
    </button>

    <iframe
      id="modalFrame"
      src=""
      frameborder="0">
    </iframe>

  </div>

</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Η εικόνα που έστειλες είναι ενσωματωμένη εδώ ως data URI.
    // Σε κανονικό project μπορείς να βάλεις: const MAP_IMAGE = './world-map.png';
    const MAP_IMAGE = 'world-map.png';

    const RADIUS = 2;

    // Άλλαξε / πρόσθεσε σημεία εδώ. lat = γεωγραφικό πλάτος, lon = γεωγραφικό μήκος.
    const pins = [

   {
    lat: 40.7128,
    lon: -74.0060,
    name: 'America',
    description: 'Level 3',
    level: 'levels/level3.html'
   },

   {
    lat: 51.5074,
    lon: -0.1278,
    name: 'tba',
    description: 'Περιγραφή για το επίπεδο 2',
    level: 'levels/level2.html'
   },

   {
    lat: 30.1109,
    lon: 30.6821,
    name: 'Europe',
    description: 'Apis Mellifera is the most common species of honey bees worldwide!',
    level: 'levels/level1.html'
   },

   {
    lat: 25.6762,
    lon: 80.6503,
    name: 'Himalaya',
    description: 'Περιγραφή για το επίπεδο 4',
    level: 'levels/level4.html'
   }

 ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6c177);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.35, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 3.2;
    controls.maxDistance = 9;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.3);
    sun.position.set(4, 2.5, 5);
    scene.add(sun);

    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const clickablePins = [];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const image = await loadImage(MAP_IMAGE);
    const worldTexture = createCroppedTexture(image);

    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS, 96, 64),
      new THREE.MeshStandardMaterial({
        map: worldTexture,
        roughness: 0.95,
        metalness: 0.0
      })
    );
    earthGroup.add(globe);

    // Ελαφριά ατμόσφαιρα για πιο 3D αίσθηση.
    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS * 1.012, 96, 64),
      new THREE.MeshBasicMaterial({
        color: 0x88cfff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending
      })
    );
    earthGroup.add(atmosphere);

    const redPinMaterial = new THREE.MeshStandardMaterial({
      color: 0xfe6db6,
      roughness: 0.45,
      metalness: 0.05
    });

    pins.forEach((pin) => earthGroup.add(createPin(pin)));

    window.addEventListener('resize', onResize);
    renderer.setAnimationLoop(animate);

    function animate() {
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Κόβει αυτόματα το μαύρο περιθώριο της εικόνας και τη μετατρέπει σε texture.
    function createCroppedTexture(img) {
      const temp = document.createElement('canvas');
      temp.width = img.width;
      temp.height = img.height;
      const tempCtx = temp.getContext('2d', { willReadFrequently: true });
      tempCtx.drawImage(img, 0, 0);

      const imageData = tempCtx.getImageData(0, 0, temp.width, temp.height).data;
      let minX = temp.width;
      let minY = temp.height;
      let maxX = 0;
      let maxY = 0;

      for (let y = 0; y < temp.height; y++) {
        for (let x = 0; x < temp.width; x++) {
          const i = (y * temp.width + x) * 4;
          const r = imageData[i];
          const g = imageData[i + 1];
          const b = imageData[i + 2];
          const a = imageData[i + 3];

          // Αγνοούμε σχεδόν μαύρα pixels, δηλαδή το εξωτερικό περιθώριο.
          if (a > 10 && (r > 15 || g > 15 || b > 15)) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }

      const padding = 2;
      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(temp.width - 1, maxX + padding);
      maxY = Math.min(temp.height - 1, maxY + padding);

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;

      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(temp, minX, minY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    function createPin(pin) {
      const group = new THREE.Group();
      const normal = latLonToVector3(pin.lat, pin.lon, 1).normalize();

      const coneHeight = 0.22;
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.055, coneHeight, 28),
        redPinMaterial
      );

      // Το tip του κώνου δείχνει προς την επιφάνεια της υδρογείου.
      cone.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        normal.clone().negate()
      );
      cone.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight / 2));
      group.add(cone);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 32, 16),
        redPinMaterial
      );
      const label = createLabelSprite(pin.name);

      label.position.copy(
      normal.clone().multiplyScalar(RADIUS + coneHeight + 0.35)
      );

      group.add(label);
      head.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight + 0.045));
      group.add(head);

      head.userData = pin;
      clickablePins.push(head);

      

      return group;
    }

    // Μετατροπή latitude/longitude σε θέση πάνω στη SphereGeometry του Three.js.
    function latLonToVector3(lat, lon, radius) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);

      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
         radius * Math.cos(phi),
         radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function createLabelSprite(text) {

  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.font = 'bold 42px "VT323"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // απλό arcade text (χωρίς πλαίσιο)
  ctx.fillStyle = 'rgba(254, 109, 182, 0.95)';
  ctx.fillText(text, 256, 64);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true
  });

  const sprite = new THREE.Sprite(material);

  sprite.scale.set(1.4, 0.4, 1);

  return sprite;
}
    window.addEventListener("click", onMouseClick);

function onMouseClick(event){

  mouse.x =
    (event.clientX / window.innerWidth) * 2 - 1;

  mouse.y =
   -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits =
    raycaster.intersectObjects(clickablePins);

  if(hits.length === 0) return;

  const pin = hits[0].object.userData;

  openPinPopup(pin);
}

const pinPopup =
  document.getElementById("pinPopup");

const pinTitle =
  document.getElementById("pinTitle");

const pinDescription =
  document.getElementById("pinDescription");

const playLevelButton =
  document.getElementById("playLevelButton");

function openPinPopup(pin){

  pinTitle.textContent =
    pin.name;

  pinDescription.textContent =
    pin.description;

  playLevelButton.onclick = () => {

    window.location.href =
      pin.level;

  };

  pinPopup.style.display = "block";
}

document
.getElementById("closePinPopup")
.addEventListener("click", () => {

  pinPopup.style.display = "none";

});

const modal =
  document.getElementById("modal");

const modalFrame =
  document.getElementById("modalFrame");

document
.getElementById("infoButton")
.addEventListener("click", () => {

  modalFrame.src =
    "info.html";

  modal.style.display = "flex";

});

document
.getElementById("weatherButton")
.addEventListener("click", () => {

  modalFrame.src =
    "weather/weather.html";

  modal.style.display = "flex";

});

document
.getElementById("closeModal")
.addEventListener("click", () => {

  modal.style.display = "none";

  modalFrame.src = "";

});
  </script>
</body>
</html>
