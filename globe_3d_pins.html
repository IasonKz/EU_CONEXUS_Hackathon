<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Υδρόγειος με πινέζες</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
      font-family: Arial, Helvetica, sans-serif;
    }

    #info {
      position: fixed;
      left: 16px;
      top: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.35;
      user-select: none;
      backdrop-filter: blur(6px);
    }

    #info strong {
      display: block;
      margin-bottom: 4px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="info">
    <strong>3D Υδρόγειος</strong>
    Σύρε με το ποντίκι για περιστροφή · scroll για zoom
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Η εικόνα που έστειλες είναι ενσωματωμένη εδώ ως data URI.
    // Σε κανονικό project μπορείς να βάλεις: const MAP_IMAGE = './world-map.png';
    const MAP_IMAGE = 'world-map.png';

    const RADIUS = 2;

    // Άλλαξε / πρόσθεσε σημεία εδώ. lat = γεωγραφικό πλάτος, lon = γεωγραφικό μήκος.
    const pins = [
      { lat: 40.7128, lon: -74.0060, number: 1, name: 'Νέα Υόρκη' },
      { lat: 51.5074, lon: -0.1278, number: 2, name: 'Λονδίνο' },
      { lat: 37.9838, lon: 23.7275, number: 3, name: 'Αθήνα' },
      { lat: 35.6762, lon: 139.6503, number: 4, name: 'Τόκιο' },
      { lat: -33.8688, lon: 151.2093, number: 5, name: 'Σίδνεϊ' },
      { lat: -23.5505, lon: -46.6333, number: 6, name: 'Σάο Πάολο' }
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070c);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.35, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 3.2;
    controls.maxDistance = 9;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.3);
    sun.position.set(4, 2.5, 5);
    scene.add(sun);

    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const image = await loadImage(MAP_IMAGE);
    const worldTexture = createCroppedTexture(image);

    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS, 96, 64),
      new THREE.MeshStandardMaterial({
        map: worldTexture,
        roughness: 0.95,
        metalness: 0.0
      })
    );
    earthGroup.add(globe);

    // Ελαφριά ατμόσφαιρα για πιο 3D αίσθηση.
    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS * 1.012, 96, 64),
      new THREE.MeshBasicMaterial({
        color: 0x88cfff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending
      })
    );
    earthGroup.add(atmosphere);

    const redPinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd90429,
      roughness: 0.45,
      metalness: 0.05
    });

    pins.forEach((pin) => earthGroup.add(createPin(pin)));

    window.addEventListener('resize', onResize);
    renderer.setAnimationLoop(animate);

    function animate() {
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Κόβει αυτόματα το μαύρο περιθώριο της εικόνας και τη μετατρέπει σε texture.
    function createCroppedTexture(img) {
      const temp = document.createElement('canvas');
      temp.width = img.width;
      temp.height = img.height;
      const tempCtx = temp.getContext('2d', { willReadFrequently: true });
      tempCtx.drawImage(img, 0, 0);

      const imageData = tempCtx.getImageData(0, 0, temp.width, temp.height).data;
      let minX = temp.width;
      let minY = temp.height;
      let maxX = 0;
      let maxY = 0;

      for (let y = 0; y < temp.height; y++) {
        for (let x = 0; x < temp.width; x++) {
          const i = (y * temp.width + x) * 4;
          const r = imageData[i];
          const g = imageData[i + 1];
          const b = imageData[i + 2];
          const a = imageData[i + 3];

          // Αγνοούμε σχεδόν μαύρα pixels, δηλαδή το εξωτερικό περιθώριο.
          if (a > 10 && (r > 15 || g > 15 || b > 15)) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }

      const padding = 2;
      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(temp.width - 1, maxX + padding);
      maxY = Math.min(temp.height - 1, maxY + padding);

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;

      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(temp, minX, minY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    function createPin(pin) {
      const group = new THREE.Group();
      const normal = latLonToVector3(pin.lat, pin.lon, 1).normalize();

      const coneHeight = 0.22;
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.055, coneHeight, 28),
        redPinMaterial
      );

      // Το tip του κώνου δείχνει προς την επιφάνεια της υδρογείου.
      cone.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        normal.clone().negate()
      );
      cone.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight / 2));
      group.add(cone);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 32, 16),
        redPinMaterial
      );
      head.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight + 0.045));
      group.add(head);

      const label = createNumberSprite(pin.number);
      label.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight + 0.22));
      group.add(label);

      return group;
    }

    // Μετατροπή latitude/longitude σε θέση πάνω στη SphereGeometry του Three.js.
    function latLonToVector3(lat, lon, radius) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);

      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
         radius * Math.cos(phi),
         radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function createNumberSprite(number) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(128, 128, 104, 0, Math.PI * 2);
      ctx.fillStyle = '#d90429';
      ctx.fill();
      ctx.lineWidth = 12;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.stroke();

      ctx.font = 'bold 118px Arial, Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(number), 128, 136);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: true,
        depthWrite: false
      });

      const sprite = new THREE.Sprite(material);
      sprite.scale.set(0.28, 0.28, 0.28);
      return sprite;
    }
  </script>
</body>
</html>
