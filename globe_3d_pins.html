<html lang="en">
<head>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    html, body {

    #info {

      border-radius: 12px;
      padding: 10px 12px;
      font-size: 30px;
      line-height: 1.35;
      user-select: none;
      backdrop-filter: blur(6px);
      text-shadow:3px 3px 0 #fe6db6;
      z-index: 600;
    }

    #info strong {
      display: block;
      margin-bottom: 4px;
    }

    #progressHint{
      position:fixed;
      right:22px;
      top:20px;
      z-index:650;
      color:#2b2118;
      background:rgba(255,248,209,.92);
      border:4px solid #2b2118;
      border-radius:14px;
      padding:8px 14px;
      font-size:24px;
      box-shadow:0 6px 0 rgba(0,0,0,.18);
      text-align:center;
      min-width:200px;
    }

    canvas {
      display: block;
    }

    #bottomButtons{
      position:fixed;
      bottom:54px;
      right:44px;
      left:auto;
      transform:none;
      display:flex;
      gap:38px;
      z-index:650;
    }

    #bottomButtons img{
      width:190px;
      height:190px;
      cursor:pointer;
      object-fit:contain;
      transition:.2s;
      filter:drop-shadow(0 10px 0 rgba(0,0,0,.16));
    }

    #bottomButtons img:hover{
      transform:scale(1.08);
    }

    #floraPanel{
      position:fixed;
      left:250px;
      bottom:170px;
      width:165px;
      z-index:640;
      text-align:center;
      filter:drop-shadow(0 14px 16px rgba(0,0,0,.28));
    }

    #mainCharacter{
      width:155px;
      max-width:22vw;
      height:auto;
      image-rendering:pixelated;
      display:block;
      margin:0 auto;
      pointer-events:none;
    }

    #floraName{
      display:inline-block;
      margin-top:-8px;
      padding:4px 16px;
      border:4px solid #2b2118;
      border-radius:999px;
      background:rgba(255,248,209,.96);
      color:#2b2118;
      font-size:28px;
      line-height:1;
      box-shadow:0 5px 0 rgba(0,0,0,.18);
    }

    #floraInfoButton{
      margin-top:9px;
      border:5px solid #2b2118;
      border-radius:14px;
      background:#ffd166;
      color:#2b2118;
      font-family:"VT323", monospace;
      font-size:32px;
      padding:8px 19px;
      cursor:pointer;
      box-shadow:0 7px 0 rgba(0,0,0,.18);
    }

    #floraInfoButton:hover{
      transform:translateY(-2px);
    }

    #pinPopup{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:min(480px, calc(100vw - 40px));
      background:rgb(255, 255, 255);
      color:black;
      border:5px solid #2b2118;
      border-radius:16px;
      padding:20px;
      display:none;
      z-index:5000;
      box-shadow:0 18px 40px rgba(0,0,0,.32);
      font-size:24px;
    }

    #pinPopup h2{
      margin:6px 0 10px;
      font-size:38px;
      line-height:1;
    }

    #pinLevelBadge{
      display:inline-block;
      background:#2b2118;
      color:#fff3b0;
      border-radius:999px;
      padding:4px 12px;
      font-size:22px;
      margin-bottom:6px;
    }

    #pinDescription{
      margin:10px 0 12px;
      line-height:1.18;
    }

    #pinWeather{
      border:3px dashed rgba(43,33,24,.35);
      border-radius:12px;
      padding:10px 12px;
      margin:12px 0;
      background:rgba(255,248,209,.6);
      line-height:1.15;
    }

    #pinPopup button{
      border:5px solid #2b2118;
      border-radius:14px;
      background:#ffd166;
      color:#2b2118;
      font-family:"VT323", monospace;
      font-size:31px;
      padding:10px 20px;
      margin:6px 10px 0 0;

      box-shadow:0 7px 0 rgba(0,0,0,.18);
    }

    #pinPopup button:disabled{
      background:#d9d9d9;
      color:#555;
      cursor:not-allowed;
    }

    #modal{
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      background:rgba(0, 0, 0, .18);
      z-index:9000;
    }

    #modalContent{
      width:min(960px, 88%);
      height:85%;
      background:white;
      border:6px solid #2b2118;
      border-radius:16px;
      overflow:hidden;
      position:relative;
      box-shadow:0 18px 42px rgba(0,0,0,.36);
    }

    #modalFrame{
      width:100%;
      height:100%;
      border:none;
    }

    #closeModal{
      position:absolute;
      top:10px;
      right:10px;
      width:44px;
      height:44px;
      z-index:9999;
      cursor:pointer;
      border:4px solid #2b2118;
      border-radius:12px;
      background:#fff8d1;
      font-size:24px;
      font-weight:800;
    }



#settingsButton{

#settingsPanel{

      }

      #bottomButtons img{
        width:100px;

      }



#settingsButton{
  top:18px;
  right:18px;
  width:60px;
  height:60px;
  font-size:32px;
}

      #progressHint{
        top:auto;
        bottom:20px;
        left:18px;
        right:auto;
        font-size:20px;
        min-width:160px;
      }
    }
  </style>

<body>
  <div id="info">
    <strong>apiconIASIS</strong>
    Help us save the bees!
  </div>

  <div id="progressHint"></div>


<button id="settingsButton" type="button" aria-label="Settings">⚙️</button>

<div id="settingsOverlay" aria-hidden="true">

  <script src="assets/audio-manager.js"></script>
  <script src="assets/lobby-settings.js"></script>
  <script src="assets/notebook-data.js"></script>
  <script src="assets/lobby-notebook.js"></script>
  <script src="assets/bee-book.js"></script>
  <script src="assets/credits.js"></script>
  <script src="weather/weather-api.js"></script>
  <script src="assets/accessibility-helper.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MAP_IMAGE = 'world-map.png';
    const RADIUS = 2;
    const PROGRESS_KEY = "floraUnlockedLevel";
    const COMPLETED_KEY = "floraCompletedLevels";

    function playSelect(){
      if(window.BeeAudio && typeof window.BeeAudio.play === "function"){
        window.BeeAudio.play("select");
      }
    }

    if(window.BeeAudio && typeof window.BeeAudio.startMusic === "function"){
      window.BeeAudio.startMusic();
    }

    const fallbackLocations = [
      { number: 1, region: "Athens", title: "Level 1 — Athens Hive", subtitle: "Apis mellifera Meadow", bee: "Apis mellifera", lat: 37.9838, lon: 23.7275, mapLat: 37.9838, mapLon: 23.7275, url: "levels/level1.html" },
      { number: 2, region: "Himalaya", title: "Level 2 — Himalaya Forest", subtitle: "Meliponini Forest", bee: "Meliponini", lat: 27.9881, lon: 86.9250, mapLat: 27.9881, mapLon: 86.9250, url: "levels/level2.html" },
      { number: 3, region: "Tanzania", title: "Level 3 — Tanzania Carpenter Woods", subtitle: "Xylocopa Carpenter Woods", bee: "Xylocopa violacea", lat: -6.1630, lon: 35.7516, mapLat: -6.1630, mapLon: 35.7516, url: "levels/level3.html" },
      { number: 4, region: "Uganda", title: "Level 4 — Uganda Aloe Sanctuary", subtitle: "Aloe Carpenter Sanctuary", bee: "Aloe carpenter bee", lat: 0.3476, lon: 32.5825, mapLat: 0.3476, mapLon: 32.5825, url: "levels/level4.html" },
      { number: 5, region: "New Zealand", title: "Level 5 — New Zealand Native Grove", subtitle: "Leioproctus Native Grove", bee: "Leioproctus", lat: -41.2865, lon: 174.7762, mapLat: -41.2865, mapLon: 174.7762, url: "levels/level5.html" }
    ];

    const apiLocations = window.BeeWeather ? window.BeeWeather.levelLocations : fallbackLocations;
    const originalPinOrder = [1, 2, 3, 4, 5];

    const pins = originalPinOrder.map(levelNumber => {
      const location = apiLocations.find(item => item.number === levelNumber) || fallbackLocations.find(item => item.number === levelNumber);
      return {
        ...location,
        lat: Number(location.mapLat ?? location.lat),
        lon: Number(location.mapLon ?? location.lon),
        name: location.region,
        level: location.url,
        description: `${location.subtitle}. Bee focus: ${location.bee}.`
      };
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6c177);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.35, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 3.2;
    controls.maxDistance = 9;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.3);
    sun.position.set(4, 2.5, 5);
    scene.add(sun);

    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const clickablePins = [];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const image = await loadImage(MAP_IMAGE);
    const worldTexture = createCroppedTexture(image);

    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS, 96, 64),
      new THREE.MeshStandardMaterial({
        map: worldTexture,
        roughness: 0.95,
        metalness: 0.0
      })
    );
    earthGroup.add(globe);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS * 1.012, 96, 64),
      new THREE.MeshBasicMaterial({
        color: 0x88cfff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending
      })
    );
    earthGroup.add(atmosphere);

    pins.forEach((pin) => earthGroup.add(createPin(pin)));
    updateProgressHint();

    window.addEventListener('resize', onResize);
    renderer.setAnimationLoop(animate);

    function animate() {
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function storageGet(key, fallback){
      try{
        const value = localStorage.getItem(key);
        return value === null ? fallback : value;
      }
      catch(error){
        return fallback;
      }
    }

    function storageSet(key, value){
      try{
        localStorage.setItem(key, value);
      }
      catch(error){
        // localStorage can be unavailable in some browser/file settings.
      }
    }

    function getUnlockedLevel(){
      const stored = Number(storageGet(PROGRESS_KEY, "1"));
      const base = Number.isFinite(stored) ? stored : 1;
      const completedMax = getCompletedLevels().reduce((max, level) => Math.max(max, Number(level) || 0), 0);
      const value = Math.max(1, Math.min(5, Math.max(base, completedMax + 1)));
      storageSet(PROGRESS_KEY, String(value));
      return value;
    }

    function getCompletedLevels(){
      try{
        const parsed = JSON.parse(storageGet(COMPLETED_KEY, "[]"));
        return Array.isArray(parsed) ? parsed.map(Number) : [];
      }
      catch(error){
        return [];
      }
    }

    function getPinState(pin){
      const unlockedLevel = getUnlockedLevel();
      const completed = getCompletedLevels().includes(Number(pin.number));
      const locked = Number(pin.number) > unlockedLevel;
      return { unlockedLevel, completed, locked };
    }

    function updateProgressHint(){
      const unlockedLevel = getUnlockedLevel();
      const completed = getCompletedLevels();
      const text = completed.length >= 5
        ? "All levels cleared!"
        : `Unlocked: Level ${unlockedLevel}`;
      document.getElementById("progressHint").textContent = text;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function createCroppedTexture(img) {
      const temp = document.createElement('canvas');
      temp.width = img.width;
      temp.height = img.height;
      const tempCtx = temp.getContext('2d', { willReadFrequently: true });
      tempCtx.drawImage(img, 0, 0);

      const imageData = tempCtx.getImageData(0, 0, temp.width, temp.height).data;
      let minX = temp.width;
      let minY = temp.height;
      let maxX = 0;
      let maxY = 0;

      for (let y = 0; y < temp.height; y++) {
        for (let x = 0; x < temp.width; x++) {
          const i = (y * temp.width + x) * 4;
          const r = imageData[i];
          const g = imageData[i + 1];
          const b = imageData[i + 2];
          const a = imageData[i + 3];

          if (a > 10 && (r > 15 || g > 15 || b > 15)) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }

      const padding = 2;
      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(temp.width - 1, maxX + padding);
      maxY = Math.min(temp.height - 1, maxY + padding);

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;

      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(temp, minX, minY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    function createPin(pin) {
      const state = getPinState(pin);
      const group = new THREE.Group();
      const normal = latLonToVector3(pin.lat, pin.lon, 1).normalize();
      const materialColor = state.locked ? 0x777777 : state.completed ? 0x57cc99 : 0xfe6db6;
      const pinMaterial = new THREE.MeshStandardMaterial({
        color: materialColor,
        roughness: 0.45,
        metalness: 0.05
      });

      const coneHeight = 0.22;
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.055, coneHeight, 28),
        pinMaterial
      );

      cone.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        normal.clone().negate()
      );
      cone.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight / 2));
      cone.userData = pin;
      group.add(cone);
      clickablePins.push(cone);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(state.locked ? 0.075 : 0.095, 32, 16),
        pinMaterial
      );
      head.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight + 0.045));
      head.userData = pin;
      group.add(head);
      clickablePins.push(head);

      const label = createLabelSprite(pin, state);
      label.position.copy(normal.clone().multiplyScalar(RADIUS + coneHeight + 0.48));
      label.userData = pin;
      group.add(label);
      clickablePins.push(label);

      return group;
    }

    function latLonToVector3(lat, lon, radius) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);

      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
         radius * Math.cos(phi),
         radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function createLabelSprite(pin, state) {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 240;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bg = state.locked ? 'rgba(91,91,91,.92)' : state.completed ? 'rgba(69, 173, 104, .94)' : 'rgba(254, 109, 182, .94)';
      const sub = state.locked ? 'LOCKED' : state.completed ? 'CLEARED' : 'UNLOCKED';

      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.fillRect(46, 36, 548, 164);
      ctx.fillStyle = bg;
      ctx.fillRect(36, 26, 548, 164);
      ctx.strokeStyle = '#2b2118';
      ctx.lineWidth = 8;
      ctx.strokeRect(36, 26, 548, 164);

      ctx.font = 'bold 58px "VT323"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff8d6';
      ctx.fillText(`LEVEL ${pin.number}`, 310, 74);

      ctx.font = 'bold 38px "VT323"';
      ctx.fillText(sub, 310, 122);

      ctx.font = 'bold 34px "VT323"';
      ctx.fillText(pin.region, 310, 166);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true
      });

      const sprite = new THREE.Sprite(material);
      sprite.scale.set(1.48, 0.55, 1);

      return sprite;
    }

    window.addEventListener("click", onMouseClick);

    function onMouseClick(event){
      if(event.target !== renderer.domElement) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(clickablePins);
      if(hits.length === 0) return;

      const pin = hits[0].object.userData;
      openPinPopup(pin);
    }

    const pinPopup = document.getElementById("pinPopup");
    const pinLevelBadge = document.getElementById("pinLevelBadge");
    const pinTitle = document.getElementById("pinTitle");
    const pinDescription = document.getElementById("pinDescription");
    const pinWeather = document.getElementById("pinWeather");
    const playLevelButton = document.getElementById("playLevelButton");

    function escapeHtml(value){
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function openPinPopup(pin){
      playSelect();
      const state = getPinState(pin);
      const statusText = state.locked ? "LOCKED" : state.completed ? "CLEARED" : "UNLOCKED";

      pinLevelBadge.textContent = `${statusText} · LEVEL ${pin.number}`;
      pinTitle.textContent = `${pin.title || "Level " + pin.number}`;

      const lockText = state.locked
        ? `<br><strong>Unlock:</strong> Clear Level ${pin.number - 1} first.`
        : "";

      pinDescription.innerHTML =
        `${escapeHtml(pin.description)}<br><strong>Pin:</strong> ${escapeHtml(pin.region)}${lockText}`;

      playLevelButton.disabled = state.locked;
      playLevelButton.textContent = state.locked ? "Locked" : `Play Level ${pin.number}`;
      playLevelButton.onclick = state.locked ? null : () => {
        playSelect();
        window.location.href = pin.level;
      };

      pinWeather.textContent = "Weather API loading…";
      loadPinWeather(pin);

      pinPopup.style.display = "block";
    }

    async function loadPinWeather(pin){
      if(!window.BeeWeather){
        pinWeather.textContent = "Weather API is not available.";
        return;
      }

      try{
        const weather = await window.BeeWeather.getCurrentWeather(pin);
        pinWeather.innerHTML =
          `<strong>API Weather:</strong> ${escapeHtml(weather.description)} (${escapeHtml(weather.conditionLabel)})<br>` +
          `🌡 ${escapeHtml(window.BeeWeather.formatTemperature(weather.temperature))} · ` +
          `🌬 ${escapeHtml(window.BeeWeather.formatWind(weather.windSpeed))}<br>` +
          `<strong>Weather data:</strong> Open-Meteo · CC BY 4.0<br>` +
          `<strong>Level:</strong> uses the selected PNG background.`;
      }
      catch(error){
        pinWeather.textContent = "Weather API failed. The level still uses its selected PNG background.";
      }
    }

    document
      .getElementById("closePinPopup")
      .addEventListener("click", () => {
        playSelect();
        pinPopup.style.display = "none";
      });

    const modal = document.getElementById("modal");
    const modalFrame = document.getElementById("modalFrame");

    function openModal(src){
      modalFrame.src = src;
      modal.style.display = "flex";
    }

    document
      .getElementById("infoButton")
      .addEventListener("click", () => {
        playSelect();
        openModal("info.html");
      });

    document
      .getElementById("floraInfoButton")
      .addEventListener("click", () => {
        playSelect();
        openModal("info.html");
      });

    document
      .getElementById("weatherButton")
      .addEventListener("click", () => {
        playSelect();
        openModal("weather/weather.html");
      });

    document
      .getElementById("closeModal")
      .addEventListener("click", () => {
        playSelect();
        modal.style.display = "none";
        modalFrame.src = "";
      });

  </script>
</body>
</html>
